modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ChinaEX123"
description='''
Provides some easy-to-use code.
'''

[[mixins]]
config="${mod_id}.mixins.json"

